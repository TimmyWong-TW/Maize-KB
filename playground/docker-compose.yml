version: '3.4'
services:
  txt:
    scale: 0
    image: ${DOCKER_REGISTRY-}txt
    build:
      context: .
      dockerfile: txt/Dockerfile
      target: inference
    volumes:
      - ../tsv:/kb/tsv:ro
      - ./kb/txt:/kb/txt
  nginx:
    container_name: nginx
    image: nginx
    deploy:
      restart_policy:
        condition: always
    ports:
      - 443:443
    volumes:
      - /home/timtim/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/timtim:/data:ro
      - app_maize:/app/maize:ro
  embedding:
    container_name: embedding
    image: embedding
    deploy:
      restart_policy:
        condition: always
    build:
      context: .
      dockerfile: embedding/Dockerfile
    volumes:
      - huggingface-hub:/root/.cache/huggingface/hub
  flowise:
    container_name: flowise
    image: flowiseai/flowise
    deploy:
      restart_policy:
        condition: always
    environment:
      NUMBER_OF_PROXIES: '1'
      FLOWISE_USERNAME: mai4tw
      FLOWISE_PASSWORD: aMa!z1N9
    volumes:
      - flowise:/root/.flowise
volumes:
  huggingface-hub:
    name: huggingface-hub
    external: true
  flowise:
    name: flowise
    external: true
  app_maize:
    name: app_maize
    external: true
