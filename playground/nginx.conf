events {
	worker_connections 1024;
}

http {
	proxy_read_timeout 300s;
	http2 on;
	http3 on;
	quic_retry on;

	server {
		listen 443 ssl default_server;
		listen 443 quic reuseport default_server;
		server_name *.ai4.tw ai4.tw;

		ssl_certificate /data/ai4.tw.crt;
		ssl_certificate_key /data/ai4.tw.key;

		location / {
			return 301 https://timmywong.tw;
		}
	}

	server {
		listen 443 ssl;
		listen 443 quic;
		server_name *.xn--vgu92j.xn--kpry57d xn--vgu92j.xn--kpry57d;

		ssl_certificate /data/xn--vgu92j.xn--kpry57d.crt;
		ssl_certificate_key /data/xn--vgu92j.xn--kpry57d.key;

		location / {
			return 301 https://timmywong.tw;
		}
	}

	server {
		listen 443 ssl;
		listen 443 quic;
		server_name flowise.ai4.tw flowise.starter.ai4.tw;

		ssl_certificate /data/ai4.tw.crt;
		ssl_certificate_key /data/ai4.tw.key;

		location / {
			proxy_pass http://flowise:3000;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection 'upgrade';
			proxy_cache_bypass $http_upgrade;
			proxy_buffering off;
			client_max_body_size 0;
		}
	}

	server {
		listen 443 ssl;
		listen 443 quic;
		server_name m.ai4.tw;

		ssl_certificate /data/ai4.tw.crt;
		ssl_certificate_key /data/ai4.tw.key;

		location / {
			return 301 https://xn--yet495cvjg.xn--vgu92j.xn--kpry57d;
		}
	}

	server {
		listen 443 ssl;
		listen 443 quic;
		server_name xn--yet495cvjg.xn--vgu92j.xn--kpry57d;

		ssl_certificate /data/xn--vgu92j.xn--kpry57d.crt;
		ssl_certificate_key /data/xn--vgu92j.xn--kpry57d.key;

		location / {
			root /app/maize;
			try_files $uri /index.html;
		}
	}
}
